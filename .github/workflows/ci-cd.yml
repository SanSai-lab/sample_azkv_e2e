name: CI/CD Pipeline for Azure Key Vault E2E

on:
  push:
    branches:
    - development
    - uat

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Build Application
      run: mvn clean package -DskipTests

    - name: Login to Azure
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Generate Image Tag
      run: |
            TIMESTAMP=$(date +%Y%m%d%H%M%S)
            echo "IMAGE_TAG=${TIMESTAMP}" >> $GITHUB_ENV
            
    - name: Docker Login to ACR
      run: echo ${{ secrets.AZURE_CLIENT_SECRET }} | docker login ${{ secrets.ACR_NAME }}.azurecr.io -u ${{ secrets.AZURE_CLIENT_ID }} --password-stdin
      env:
        ACR_NAME: ${{ secrets.ACR_NAME }}

    - name: Build and Push Docker Image
      run: |
        docker build -t ${{ secrets.ACR_NAME }}.azurecr.io/azure-keyvault-e2e:$IMAGE_TAG .
        docker push ${{ secrets.ACR_NAME }}.azurecr.io/azure-keyvault-e2e:$IMAGE_TAG

    - name: Display Image Tag
      run: |
        echo "New Docker image pushed with tag: ${IMAGE_TAG}"

  # Helm Chart Packaging & Push to ACR
  build-and-push-helm-chart:
    runs-on: ubuntu-latest
    needs: build-and-push # Run after Docker build

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Login to Azure
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Helm Login to ACR
      run: |
        az acr login --name ${{ secrets.ACR_NAME }}
        helm registry login ${{ secrets.ACR_NAME }}.azurecr.io --username ${{ secrets.AZURE_CLIENT_ID }} --password ${{ secrets.AZURE_CLIENT_SECRET }}

    - name: Verify Helm Chart Directory
      run: |
        echo "📂 Checking Helm chart directory contents..."
        ls -l charts/azure-keyvault-e2e/

    - name: Package Helm Chart
      run: |
        cd charts/azure-keyvault-e2e
        helm package . --destination ../../
        cd ../..

    - name: Verify Packaged Helm Chart
      run: |
        echo "📂 Checking packaged Helm chart files..."
        ls -l

    - name: Push Helm Chart to ACR
      run: |
        CHART_VERSION=$(grep 'version:' charts/azure-keyvault-e2e/Chart.yaml | awk '{print $2}')
        HELM_PACKAGE="azure-keyvault-e2e-${CHART_VERSION}.tgz"

        if [ -f "$HELM_PACKAGE" ]; then
          echo "✅ Helm package found: $HELM_PACKAGE"
          helm push $HELM_PACKAGE oci://${{ secrets.ACR_NAME }}.azurecr.io/charts
        else
          echo "❌ Helm package not found! Check packaging step."
          exit 1
        fi

    - name: Verify Helm Chart in ACR
      run: |
        echo "🔍 Checking Helm charts in ACR..."
        az acr repository show-tags --name ${{ secrets.ACR_NAME }} --repository charts/azure-keyvault-e2e
