name: CI/CD Pipeline for Azure Key Vault E2E

on:
  push:
    branches:
    - development
    - uat

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Build Application
      run: mvn clean package -DskipTests

    - name: Login to Azure
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Generate Image Tag
      run: |
        SHORT_SHA=$(git rev-parse --short HEAD)
        TIMESTAMP=$(date +%Y%m%d%H%M%S)
        echo "IMAGE_TAG=${TIMESTAMP}-${SHORT_SHA}" >> $GITHUB_ENV

    - name: Docker Login to ACR
      run: echo ${{ secrets.AZURE_CLIENT_SECRET }} | docker login ${{ secrets.ACR_NAME }}.azurecr.io -u ${{ secrets.AZURE_CLIENT_ID }} --password-stdin
      env:
        ACR_NAME: ${{ secrets.ACR_NAME }}

    - name: Build and Push Docker Image
      run: |
        docker build -t ${{ secrets.ACR_NAME }}.azurecr.io/azure-keyvault-e2e:$IMAGE_TAG .
        docker push ${{ secrets.ACR_NAME }}.azurecr.io/azure-keyvault-e2e:$IMAGE_TAG

    - name: Display Image Tag
      run: |
        echo "New Docker image pushed with tag: ${IMAGE_TAG}"

    # Helm Chart Packaging & Push (Added Below)
    - name: Helm Login to ACR
      run: |
        az acr login --name ${{ secrets.ACR_NAME }}
        helm registry login ${{ secrets.ACR_NAME }}.azurecr.io --username ${{ secrets.AZURE_CLIENT_ID }} --password ${{ secrets.AZURE_CLIENT_SECRET }}

    - name: Package Helm Chart
      run: |
        cd charts/azure-keyvault-e2e
        helm package . --destination .

    - name: Push Helm Chart to ACR
      run: |
        CHART_VERSION=$(helm show chart charts/azure-keyvault-e2e | grep version | awk '{print $2}')
        helm push azure-keyvault-e2e-${CHART_VERSION}.tgz oci://${{ secrets.ACR_NAME }}.azurecr.io/charts

    - name: Verify Helm Chart in ACR
      run: |
        az acr repository show-tags --name ${{ secrets.ACR_NAME }} --repository charts/azure-keyvault-e2e
