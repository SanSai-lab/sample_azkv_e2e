name: CI/CD Pipeline for Azure Key Vault E2E

on:
  push:
    branches:
    - development
    - uat

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Build Application
      run: mvn clean package -DskipTests

    - name: Login to Azure
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Generate Image Tag
      run: |
        SHORT_SHA=$(git rev-parse --short HEAD)
        TIMESTAMP=$(date +%Y%m%d%H%M%S)
        echo "IMAGE_TAG=${TIMESTAMP}-${SHORT_SHA}" >> $GITHUB_ENV

    - name: Docker Login to ACR
      run: echo ${{ secrets.AZURE_CLIENT_SECRET }} | docker login ${{ secrets.ACR_NAME }}.azurecr.io -u ${{ secrets.AZURE_CLIENT_ID }} --password-stdin
      env:
        ACR_NAME: ${{ secrets.ACR_NAME }}

    - name: Build and Push Docker Image
      run: |
        docker build -t ${{ secrets.ACR_NAME }}.azurecr.io/azure-keyvault-e2e:$IMAGE_TAG .
        docker push ${{ secrets.ACR_NAME }}.azurecr.io/azure-keyvault-e2e:$IMAGE_TAG

    - name: Display Image Tag
      run: |
        echo "New Docker image pushed with tag: ${IMAGE_TAG}"
